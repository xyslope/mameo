name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --locked --release --bin mameo --bin mameo-config

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "mameo-package"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item target/release/mameo.exe $package
          Copy-Item target/release/mameo-config.exe $package
          Copy-Item portable.flag $package
          Copy-Item README.md $package
          Copy-Item LICENSE $package
          Copy-Item llm-jp-normal.md $package
          Copy-Item llm-en-normal.md $package
          $version = "${{ github.ref_name }}"
          $archive = "mameo-$version-windows-x64.zip"
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $archive
          "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Publish ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
